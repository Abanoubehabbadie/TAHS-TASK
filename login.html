<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Tasky</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <header class="topnav">
    <div class="topnav-inner">
      <a class="brand" href="index.html">
        <span class="logo"><i class="fas fa-file-lines"></i></span>
        <span>Tasky</span>
      </a>
      <div class="spacer"></div>
      <nav class="nav-links">
        <a class="nav-link hide-sm" href="index.html"><i class="fas fa-home"></i> Home</a>
        <a class="nav-link active" href="login.html"><i class="fas fa-user"></i> Login</a>
        <a class="nav-link" href="create-exam.html"><i class="fas fa-file-pen"></i> Exam Builder</a>
      </nav>
    </div>
  </header>

  <main class="container narrow">
    <div class="page-head">
      <h1><i class="fas fa-right-to-bracket"></i> Login</h1>
      <p class="subtitle">Sign in to create and manage tasks. The Exam Builder works without an account.</p>
    </div>

    <div class="panel">
      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="your@email.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>
        <div class="btn-row" style="margin-top:6px">
          <button type="submit" class="btn primary"><i class="fas fa-right-to-bracket"></i> Login</button>
        </div>
        <p class="hint" style="margin-top:12px;margin-bottom:0"><i class="fas fa-circle-info"></i> Logging in is only needed for task management. To create an exam, just use the <a href="create-exam.html">Exam Builder</a> — no account required.</p>
      </form>
    </div>
  </main>
</body>
</html>
